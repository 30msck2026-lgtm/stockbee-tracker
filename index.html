<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockbee 寬度儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md space-y-4">
    <header class="flex justify-between items-center py-2 border-b border-slate-800">
      <h1 class="text-xl font-bold tracking-wide">Stockbee Market Monitor</h1>
      <span id="latest-date" class="text-xs text-slate-400">載入中...</span>
    </header>

    <!-- T2108 卡片 -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-sm">
      <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase">T2108 (% Above 40d MA)</div>
      <div class="flex items-baseline justify-between mt-2">
        <span id="t2108-val" class="text-4xl font-extrabold text-blue-400">--%</span>
        <span id="t2108-status" class="text-xs font-semibold px-2 py-1 rounded bg-slate-700 text-slate-300">計算中</span>
      </div>
    </div>

    <!-- 4% Up / Down 卡片 -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-800 p-4 rounded-2xl border border-emerald-900/40">
        <div class="text-xs text-emerald-400 font-semibold">4% Up 股票數</div>
        <div id="up4-val" class="text-3xl font-bold text-emerald-400 mt-2">--</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-2xl border border-rose-900/40">
        <div class="text-xs text-rose-400 font-semibold">4% Down 股票數</div>
        <div id="down4-val" class="text-3xl font-bold text-rose-400 mt-2">--</div>
      </div>
    </div>

    <!-- 歷史數據列表 -->
    <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">近期歷史紀錄</h2>
      <div id="history-list" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <script>
    fetch('data.json?t=' + new Date().getTime())

      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) return;
        const latest = data[0];
        document.getElementById('latest-date').textContent = latest.date;
        document.getElementById('t2108-val').textContent = latest.t2108 + '%';
        document.getElementById('up4-val').textContent = latest.up_4;
        document.getElementById('down4-val').textContent = latest.down_4;

        // 狀態判斷
        const statusEl = document.getElementById('t2108-status');
        if (latest.t2108 >= 70) {
          statusEl.textContent = '超買警戒';
          statusEl.className = 'text-xs font-semibold px-2 py-1 rounded bg-rose-500/20 text-rose-300';
        } else if (latest.t2108 <= 20) {
          statusEl.textContent = '超賣尋底';
          statusEl.className = 'text-xs font-semibold px-2 py-1 rounded bg-emerald-500/20 text-emerald-300';
        } else {
          statusEl.textContent = '中性區間';
        }

        // 渲染歷史列表
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = data.slice(1, 8).map(d => `
          <div class="flex justify-between py-1.5 border-b border-slate-700/50">
            <span class="text-slate-400">${d.date}</span>
            <span class="font-mono">T2108: ${d.t2108}%</span>
            <span class="text-emerald-400">+${d.up_4}</span>
            <span class="text-rose-400">-${d.down_4}</span>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('latest-date').textContent = '資料初始化中...';
      });
  </script>
</body>
</html>
